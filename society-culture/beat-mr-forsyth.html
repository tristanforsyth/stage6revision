<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beat Mr Forsyth</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">HSC Society &amp; Culture Revision</a><nav><a href="games.html">Games</a><a href="past-questions.html">Past Questions</a><a href="how-to.html">How to Answer</a></nav></div></header>
<main class="wrap"><span class="tag">60 SECOND CHALLENGE</span><h1>Beat Mr Forsyth</h1><p class="lead">60-second True/False. Your target is Mr Forsyth's suspiciously variable score.</p><div class="gamebar"><b>Time: <span id="time">60</span></b> · <b>You: <span id="score">0</span></b> · <b>Mr Forsyth: <span id="mr">?</span></b></div><div class="panel"><h2 id="q">Press Start.</h2><button id="start">START</button><button class="play" onclick="ans(true)">TRUE</button><button class="play" onclick="ans(false)">FALSE</button><p id="fb"></p></div></main><script>let qs=[],x,score=0,time=60,timer,live=false;fetch('data/easy-games.json').then(r=>r.json()).then(d=>qs=d.truefalse);function next(){x=qs[Math.floor(Math.random()*qs.length)];document.getElementById('q').textContent=x.q}document.getElementById('start').onclick=()=>{score=0;time=60;live=true;document.getElementById('score').textContent=0;document.getElementById('mr').textContent='?';next();clearInterval(timer);timer=setInterval(()=>{document.getElementById('time').textContent=--time;if(time<=0){clearInterval(timer);live=false;let mr=6+Math.floor(Math.random()*7);document.getElementById('mr').textContent=mr;document.getElementById('q').textContent=score>mr?'You beat Mr Forsyth. This will be denied.':score==mr?'A draw. Mr Forsyth accepts this outcome.':'Mr Forsyth survives another day.'}},1000)};function ans(v){if(!live)return;if(v===x.a)score++;document.getElementById('score').textContent=score;document.getElementById('fb').textContent=x.why;next()}</script></body></html>
