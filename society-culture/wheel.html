<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wheel of Misfortune</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">HSC Society &amp; Culture Revision</a><nav><a href="games.html">Games</a><a href="past-questions.html">Past Questions</a><a href="how-to.html">How to Answer</a></nav></div></header>
<main class="wrap"><span class="tag">QUICK REVISION</span><h1>Wheel of Misfortune</h1><p class="lead">Spin for a random course area, then answer the short revision challenge.</p><div class="wheelbox"><div id="wheelResult" class="bigresult">?</div><button id="spin">SPIN THE WHEEL</button></div><div id="challenge" class="panel"></div></main><script>let qs=[];fetch('data/easy-games.json').then(r=>r.json()).then(d=>qs=d.wheel);document.getElementById('spin').onclick=()=>{let x=qs[Math.floor(Math.random()*qs.length)];document.getElementById('wheelResult').textContent=x.topic;document.getElementById('challenge').innerHTML=`<h2>${x.q}</h2><details><summary>Reveal answer</summary><p>${x.a}</p></details>`}</script></body></html>
