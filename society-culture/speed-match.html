<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speed Match</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">HSC Society &amp; Culture Revision</a><nav><a href="games.html">Games</a><a href="past-questions.html">Past Questions</a><a href="how-to.html">How to Answer</a></nav></div></header>
<main class="wrap"><span class="tag">QUICK REVISION</span><h1>Speed Match</h1><p class="lead">Sort each term into the correct course area as quickly as possible.</p><div class="gamebar"><b>Score: <span id="score">0</span></b></div><div class="panel center"><div id="term" class="bigresult"></div><div id="buttons"></div><p id="fb"></p></div></main><script>const cats=['South Korea','Teen Film','Islam','Research & Concepts'];let qs=[],x,score=0;fetch('data/easy-games.json').then(r=>r.json()).then(d=>{qs=d.speed;document.getElementById('buttons').innerHTML=cats.map(c=>`<button onclick="pick('${c}')">${c}</button>`).join(' ');next()});function next(){x=qs[Math.floor(Math.random()*qs.length)];document.getElementById('term').textContent=x.term}function pick(c){if(c===x.cat){score++;document.getElementById('fb').textContent='Correct.'}else document.getElementById('fb').textContent='Answer: '+x.cat;document.getElementById('score').textContent=score;next()}</script></body></html>
