<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">HSC Society &amp; Culture Revision</a><nav><a href="games.html">Games</a><a href="past-questions.html">Past Questions</a><a href="how-to.html">How to Answer</a></nav></div></header>
<main class="wrap"><span class="tag">QUICK REVISION</span><h1>Concept Snap</h1><p class="lead">Do these two things belong together? Choose MATCH or NO MATCH, then check the explanation.</p><div class="panel center"><div id="pair" class="bigresult"></div><button onclick="answer(true)">MATCH</button> <button onclick="answer(false)">NO MATCH</button><div id="feedback" class="notice"></div></div></main><script>let qs=[],x,score=0;fetch('data/easy-games.json').then(r=>r.json()).then(d=>{qs=d.snap;next()});function next(){x=qs[Math.floor(Math.random()*qs.length)];document.getElementById('pair').innerHTML=`${x.left}<br>↔<br>${x.right}`;document.getElementById('feedback').textContent=''}function answer(v){document.getElementById('feedback').innerHTML=(v===x.match?'<b>SNAP — correct.</b> ':'<b>Not quite.</b> ')+x.why+' <button onclick="next()">Next</button>'}</script></body></html>
