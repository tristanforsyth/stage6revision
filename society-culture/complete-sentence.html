<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete the Sentence</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">HSC Society &amp; Culture Revision</a><nav><a href="games.html">Games</a><a href="past-questions.html">Past Questions</a><a href="how-to.html">How to Answer</a></nav></div></header>
<main class="wrap"><span class="tag">QUICK REVISION</span><h1>Complete the Sentence</h1><p class="lead">Choose the ending that makes the course statement accurate.</p><div class="panel"><h2 id="stem"></h2><div id="opts"></div><p id="fb"></p><button id="next">Next</button></div></main><script>let qs=[],x;fetch('data/easy-games.json').then(r=>r.json()).then(d=>{qs=d.sentences;next()});function next(){x=qs[Math.floor(Math.random()*qs.length)];document.getElementById('stem').textContent=x.stem;document.getElementById('fb').textContent='';document.getElementById('opts').innerHTML=x.opts.map((o,i)=>`<button class="option" onclick="pick(${i})">${o}</button>`).join('')}function pick(i){document.getElementById('fb').textContent=i===x.a?'Correct.':'Not quite. Correct answer: '+x.opts[x.a]}document.getElementById('next').onclick=next;</script></body></html>
